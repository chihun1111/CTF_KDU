events {}

http {
  server_tokens off;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  upstream frontend {
    server frontend:3000;
  }

  upstream backend {
    server backend:8080;
  }

  upstream challenge01 { server challenge-01:8080; }
  upstream challenge02 { server challenge-02:8080; }
  upstream challenge03 { server challenge-03:8080; }
  upstream challenge04 { server challenge-04:8080; }
  upstream challenge05 { server challenge-05:8080; }
  upstream challenge06 { server challenge-06:8080; }
  upstream challenge07 { server challenge-07:8080; }
  upstream challenge08 { server challenge-08:8080; }

  # Only old bookmarks use these redirects. Preserve the raw escaped path and
  # query; links rendered by the app already use the canonical numbered URLs.
  map $request_uri $legacy_challenge_redirect {
    default "";
    ~^/campus/festival(?:/(?<legacy01_path>[^?]*))?(?<legacy01_query>\?.*)?$ /challenges/01/$legacy01_path$legacy01_query;
    ~^/system/status(?:/(?<legacy02_path>[^?]*))?(?<legacy02_query>\?.*)?$ /challenges/02/$legacy02_path$legacy02_query;
    ~^/student/assignments(?:/(?<legacy03_path>[^?]*))?(?<legacy03_query>\?.*)?$ /challenges/03/$legacy03_path$legacy03_query;
    ~^/clubs/admin(?:/(?<legacy04_path>[^?]*))?(?<legacy04_query>\?.*)?$ /challenges/04/$legacy04_path$legacy04_query;
    ~^/clubs/security(?:/(?<legacy05_path>[^?]*))?(?<legacy05_query>\?.*)?$ /challenges/05/$legacy05_path$legacy05_query;
    ~^/clubs/build-archive(?:/(?<legacy06_path>[^?]*))?(?<legacy06_query>\?.*)?$ /challenges/06/$legacy06_path$legacy06_query;
    ~^/community/board(?:/(?<legacy07_path>[^?]*))?(?<legacy07_query>\?.*)?$ /challenges/07/$legacy07_path$legacy07_query;
    ~^/bonus/vault(?:/(?<legacy08_path>[^?]*))?(?<legacy08_query>\?.*)?$ /challenges/08/$legacy08_path$legacy08_query;
  }

  server {
    listen 80;
    server_name _;
    absolute_redirect off;
    if ($legacy_challenge_redirect != "") {
      return 308 $legacy_challenge_redirect;
    }

    client_max_body_size 64k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This Nginx instance is the only public hop. Do not preserve a client-
    # supplied X-Forwarded-For value, otherwise backend rate-limit keys are
    # spoofable after Express is configured to trust this proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header X-User-Id "";
    proxy_set_header X-Student-Id "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Internal-Service "";
    proxy_set_header X-Internal-Token "";

    location /internal/ {
      return 404;
    }

    location /api/ {
      proxy_pass http://backend;
    }

    location = /challenges/01 { return 308 /challenges/01/$is_args$args; }
    location = /challenges/02 { return 308 /challenges/02/$is_args$args; }
    location = /challenges/03 { return 308 /challenges/03/$is_args$args; }
    location = /challenges/04 { return 308 /challenges/04/$is_args$args; }
    location = /challenges/05 { return 308 /challenges/05/$is_args$args; }
    location = /challenges/06 { return 308 /challenges/06/$is_args$args; }
    location = /challenges/07 { return 308 /challenges/07/$is_args$args; }
    location = /challenges/08 { return 308 /challenges/08/$is_args$args; }

    location /challenges/01/ { proxy_pass http://challenge01/; }
    location /challenges/02/ { proxy_pass http://challenge02/; }
    location /challenges/03/ { proxy_pass http://challenge03/; }
    location /challenges/04/ { proxy_pass http://challenge04/; }
    location /challenges/05/ { proxy_pass http://challenge05/; }
    location /challenges/06/ { proxy_pass http://challenge06/; }
    location /challenges/07/ { proxy_pass http://challenge07/; }
    location /challenges/08/ { proxy_pass http://challenge08/; }

    location / {
      proxy_pass http://frontend;
    }
  }
}
